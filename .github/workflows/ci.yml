name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests app.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: pytest -q
        env:
          # Demo defaults only — no real SSH secrets in CI; collectors are mocked in tests.
          SECRET_KEY: ci-test-secret-not-for-production
          ADMIN_PASSWORD: admin123

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: App factory smoke (no public bind)
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app({"TESTING": True, "SECRET_KEY": "smoke", "ADMIN_PASSWORD": "admin123", "DATABASE": ":memory:"})
          assert app is not None
          c = app.test_client()
          assert c.get("/login").status_code == 200
          print("smoke_ok")
          PY
