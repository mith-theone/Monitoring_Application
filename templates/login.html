{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="login-panel" aria-label="Sign in">
  <h2 class="login-heading">Sign in</h2>
  <p class="login-hint">Demo Monitoring (jumpuser3) — metrics UI is read-only after login.</p>
  <p class="login-hint"><strong>Demo credentials:</strong> username <code>admin</code> · password <code>admin123</code></p>

  <form method="post" action="{{ url_for('login') }}" class="login-form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" type="text" id="username" name="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
